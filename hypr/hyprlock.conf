########################################################
# General settings
########################################################
general {
    hide_cursor = true
    no_fade_in  = false
    no_fade_out = false
}

########################################################
# Blurred background
########################################################
background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 7
    noise       = 0.0
}

########################################################
# Centered Time Label
########################################################
label {
    monitor      =
    halign       = center
    valign       = center
    position     = 0, 80
    font_family  = JetBrains Mono
    font_size    = 160
    color        = rgba(205, 214, 244, 0.8)  # Catppuccin text
    text         = $TIME
}

########################################################
# Date Label (below time)
########################################################
label {
    monitor      =
    halign       = center
    valign       = center
    position     = 0, -40
    font_family  = JetBrains Mono
    font_size    = 24
    color        = rgba(205, 214, 244, 0.7)  # Catppuccin text (slightly dimmer)
    text         = cmd[update:1000] echo "$(date '+%A, %B %d')"
}

########################################################
# Battery Indicator (top right)
########################################################
label {
    monitor      =
    halign       = right
    valign       = top
    position     = -20, 20
    font_family  = JetBrains Mono
    font_size    = 20
    color        = rgba(166, 209, 137, 0.8)  # Catppuccin green
    text         = cmd[update:5000] echo " $(cat /sys/class/power_supply/BAT*/capacity)%"
}

########################################################
# Password Entry Field
########################################################
input-field {
    monitor             =
    size                = 400, 60       # width, height
    outline_thickness   = 3
    dots_size           = 0.25          # scale of dots vs. field height
    dots_spacing        = 0.15          # spacing between dots
    dots_center         = true
    dots_rounding       = -1            # full rounding (circles)
    dots_text_format    = ●           # character used for each dot
    outer_color         = rgba(136, 57, 239, 0.5)  # Catppuccin mauve
    inner_color         = rgba(30, 30, 46, 0.8)    # Catppuccin base
    font_color          = rgba(205, 214, 244, 0.8) # Catppuccin text
    placeholder_text    = <i>Enter Password...</i>
    hide_input          = false         # show dots rather than hiding input
    rounding            = -1
    position            = 0,  -180        # 180px below center
    halign              = center
    valign              = center
}

