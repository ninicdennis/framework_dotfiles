general {
    # how to invoke the lock-screen
    lock_cmd = pidof hyprlock || hyprlock
}

# ─── after 14 minutes: warn about upcoming lock ───────────────────────────────────────
listener {
    timeout    = 840   # 14 min
    on-timeout = notify-send "Locking Soon" "Screen will lock in 1 minute" -u normal
}

# ─── after 15 minutes: dim & lock ──────────────────────────────────────────────────
listener {
    timeout    = 900   # 15 min
    # first dim, then lock
    on-timeout = brightnessctl -s set 10 && ( pidof hyprlock || hyprlock )
    # when you come back, restore brightness (hyprlock will exit)
    on-resume  = brightnessctl -r
}

# ─── after 30 minutes: blank the screen ───────────────────────────────────────────
listener {
    timeout    = 1800  # 30 min
    # turn the panel completely off via DPMS
    on-timeout = hyprctl dispatch dpms off
    # on any activity, turn DPMS back on and restore brightness
    on-resume  = hyprctl dispatch dpms on && brightnessctl -r
}

# ─── after 60 minutes: suspend system ─────────────────────────────────────────────
listener {
    timeout    = 3600  # 60 min
    on-timeout = systemctl suspend
}

