########################################################
# General settings
########################################################
general {
    hide_cursor = true
    no_fade_in  = false
    no_fade_out = false
}

########################################################
# Blurred background
########################################################
background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 7
    noise       = 0.0
}

########################################################
# Centered Time Label
########################################################
label {
    monitor      =
    halign       = center
    valign       = center
    position     = 0, 0
    font_family  = JetBrains Mono
    font_size    = 160
    color        = rgba(255,255,255,0.8)
    text         = $TIME
}

########################################################
# Password Entry Field
########################################################
input-field {
    monitor             =
    size                = 400, 60       # width, height
    outline_thickness   = 3
    dots_size           = 0.25          # scale of dots vs. field height
    dots_spacing        = 0.15          # spacing between dots
    dots_center         = true
    dots_rounding       = -1            # full rounding (circles)
    dots_text_format    = ●           # character used for each dot
    outer_color         = rgba(255,255,255,0.3)
    inner_color         = rgba(0,0,0,0.5)
    font_color          = rgba(255,255,255,0.8)
    placeholder_text    = <i>Enter Password...</i>
    hide_input          = false         # show dots rather than hiding input
    rounding            = -1
    position            = 0,  -180        # 180px below center
    halign              = center
    valign              = center
}

